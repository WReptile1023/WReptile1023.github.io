<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机名字抽取器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-weight: 600;
        }

        .description {
            text-align: center;
            margin-bottom: 30px;
            color: #7f8c8d;
            line-height: 1.6;
        }

        .upload-area {
            border: 2px dashed #3498db;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        .upload-area:hover,
        .upload-area.dragover {
            background-color: #e8f4fc;
            border-color: #2980b9;
        }

        .upload-icon {
            font-size: 48px;
            color: #3498db;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 18px;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .upload-hint {
            font-size: 14px;
            color: #7f8c8d;
        }

        #file-input {
            display: none;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }

        input[type="number"]:focus {
            border-color: #3498db;
            outline: none;
        }

        button {
            background: linear-gradient(to right, #3498db, #2c3e50);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results-section {
            margin-top: 30px;
        }

        .results-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #2c3e50;
            text-align: center;
        }

        #results-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .result-item {
            background-color: #3498db;
            color: white;
            padding: 12px 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease;
        }

        .result-item.highlight {
            background: linear-gradient(to right, #e74c3c, #e67e22);
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-info {
            background-color: #f1f8ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
        }

        .file-info p {
            margin: 5px 0;
            color: #2c3e50;
        }

        .names-preview {
            max-height: 200px;
            overflow-y: auto;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #e9ecef;
        }

        .names-preview h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .names-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .name-tag {
            background-color: #e9ecef;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            color: #495057;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 24px;
            }

            .upload-area {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>随机名字抽取器</h1>
        <p class="description">上传包含名字的txt文件（每行一个名字，utf-8编码），然后随机抽取指定数量的名字</p>

        <div class="upload-area" id="upload-area">
            <div class="upload-icon">📁</div>
            <p class="upload-text">点击或拖拽文件到此处上传</p>
            <p class="upload-hint">支持.txt文件，每行一个名字</p>
            <input type="file" id="file-input" accept=".txt">
        </div>

        <div class="file-info" id="file-info" style="display: none;">
            <p>已上传文件: <span id="file-name"></span></p>
            <p>名字总数: <span id="names-count"></span></p>
        </div>

        <div class="names-preview" id="names-preview" style="display: none;">
            <h3>名字预览</h3>
            <div class="names-list" id="names-list"></div>
        </div>

        <div class="input-group">
            <label for="count-input">抽取数量</label>
            <input type="number" id="count-input" min="1" placeholder="请输入要抽取的名字数量">
        </div>

        <button id="draw-button" disabled>开始抽取</button>

        <div class="results-section">
            <h2 class="results-title">抽取结果</h2>
            <div id="results-container"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const uploadArea = document.getElementById('upload-area');
            const fileInput = document.getElementById('file-input');
            const fileInfo = document.getElementById('file-info');
            const fileName = document.getElementById('file-name');
            const namesCount = document.getElementById('names-count');
            const namesPreview = document.getElementById('names-preview');
            const namesList = document.getElementById('names-list');
            const countInput = document.getElementById('count-input');
            const drawButton = document.getElementById('draw-button');
            const resultsContainer = document.getElementById('results-container');

            let namesArray = [];

            // 点击上传区域触发文件选择
            uploadArea.addEventListener('click', function () {
                fileInput.click();
            });

            // 拖放功能
            uploadArea.addEventListener('dragover', function (e) {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', function () {
                uploadArea.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', function (e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');

                if (e.dataTransfer.files.length) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            // 文件选择变化
            fileInput.addEventListener('change', function () {
                if (fileInput.files.length) {
                    handleFile(fileInput.files[0]);
                }
            });

            // 处理上传的文件
            function handleFile(file) {
                if (file.type !== 'text/plain' && !file.name.endsWith('.txt')) {
                    alert('请上传.txt文件');
                    return;
                }

                fileName.textContent = file.name;

                const reader = new FileReader();
                reader.onload = function (e) {
                    const content = e.target.result;
                    namesArray = content.split('\n')
                        .map(name => name.trim())
                        .filter(name => name.length > 0);

                    namesCount.textContent = namesArray.length;
                    fileInfo.style.display = 'block';

                    // 显示名字预览
                    namesList.innerHTML = '';
                    namesArray.slice(0, 50).forEach(name => {
                        const nameTag = document.createElement('span');
                        nameTag.className = 'name-tag';
                        nameTag.textContent = name;
                        namesList.appendChild(nameTag);
                    });

                    if (namesArray.length > 50) {
                        const moreTag = document.createElement('span');
                        moreTag.className = 'name-tag';
                        moreTag.textContent = `... 还有 ${namesArray.length - 50} 个名字`;
                        namesList.appendChild(moreTag);
                    }

                    namesPreview.style.display = 'block';

                    // 启用抽取按钮
                    updateDrawButton();
                };

                reader.readAsText(file);
            }

            // 更新抽取按钮状态
            function updateDrawButton() {
                const count = parseInt(countInput.value);
                drawButton.disabled = !(namesArray.length > 0 && count > 0 && count <= namesArray.length);

                if (count > namesArray.length) {
                    countInput.setCustomValidity(`抽取数量不能超过名字总数（${namesArray.length}）`);
                } else {
                    countInput.setCustomValidity('');
                }
            }

            countInput.addEventListener('input', updateDrawButton);

            // 抽取名字
            drawButton.addEventListener('click', function () {
                const count = parseInt(countInput.value);
                if (count <= 0 || count > namesArray.length) {
                    alert('请输入有效的抽取数量');
                    return;
                }

                // 复制名字数组并打乱顺序
                const shuffledNames = [...namesArray].sort(() => Math.random() - 0.5);

                // 抽取指定数量的名字
                const selectedNames = shuffledNames.slice(0, count);

                // 显示结果
                resultsContainer.innerHTML = '';
                selectedNames.forEach((name, index) => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    resultItem.textContent = name;

                    // 第一个结果高亮显示
                    if (index === 0) {
                        resultItem.classList.add('highlight');
                    }

                    resultsContainer.appendChild(resultItem);
                });
            });
        });
    </script>
</body>

</html>
