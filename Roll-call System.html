<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WR点名系统-WReptile</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            padding: 25px;
            text-align: center;
            position: relative;
        }

        h1 {
            color: #2575fc;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .progress-container {
            width: 100%;
            background: #f0f0f0;
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 10px;
            background: linear-gradient(90deg, #4cd964, #5ac8fa);
            border-radius: 10px;
            width: 0%;
            transition: width 0.5s ease;
        }

        .total-count {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ffce54;
            color: #333;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .current-count {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #5ac8fa;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .name-display {
            font-size: 36px;
            font-weight: bold;
            margin: 40px 0;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2575fc;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            padding: 10px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .present-btn {
            background: #4cd964;
            color: white;
        }

        .absent-btn {
            background: #ff3b30;
            color: white;
        }

        .export-btn {
            background: #5ac8fa;
            color: white;
            margin-top: 20px;
            width: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .upload-container {
            margin: 20px 0;
            padding: 20px;
            border: 2px dashed #2575fc;
            border-radius: 15px;
            background: rgba(37, 117, 252, 0.1);
        }

        .file-input {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 12px 25px;
            background: #2575fc;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .file-label:hover {
            background: #1a5fd0;
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            text-align: left;
        }

        .result-item {
            margin-bottom: 15px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
        }

        .result-value {
            font-weight: bold;
            color: #2575fc;
        }

        .absent-list {
            margin-top: 10px;
            padding: 15px;
            background: #ffebee;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }

        .absent-name {
            padding: 5px;
            border-bottom: 1px dashed #ffcdd2;
        }

        .stage {
            display: none;
        }

        .active {
            display: block;
        }

        .pulse {
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.05);
            }
        }

        .export-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            display: none;
        }

        .error-message {
            color: #ff3b30;
            margin-top: 10px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 24px;
            }

            .name-display {
                font-size: 28px;
                min-height: 100px;
            }

            button {
                padding: 12px 20px;
                font-size: 14px;
            }

            .total-count,
            .current-count {
                position: relative;
                top: unset;
                left: unset;
                right: unset;
                display: inline-block;
                margin: 10px 5px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="stage active" id="uploadStage">
            <h1>WR点名系统</h1>
            <p style="color: #2575fc;font-size: 15px;">作者：WReptile</p>
            <div class="upload-container">
                <p>请上传名字文件</p>
                <p style="font-size: 14px; color: #666; margin: 10px 0;">文件格式: 每行一个名字，txt格式，UTF-8编码</p>
                <input type="file" id="fileInput" class="file-input" accept=".txt">
                <label for="fileInput" class="file-label">选择文件</label>
                <p id="fileName" style="margin-top: 10px; font-weight: bold;"></p>
                <div id="errorMessage" class="error-message"></div>
            </div>
        </div>

        <div class="stage" id="rollcallStage">
            <h1>点名中</h1>
            <div class="total-count" id="totalCount">总人数: 0</div>
            <div class="current-count" id="currentCount">当前: 0/0</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="name-display" id="nameDisplay">准备开始</div>
            <div class="button-container">
                <button class="present-btn" id="presentBtn">已到</button>
                <button class="absent-btn" id="absentBtn">未到</button>
            </div>
        </div>

        <div class="stage" id="resultsStage">
            <h1>点名结果</h1>
            <p class="time_time" id="time_new" style="color: #6e9be8;font-size: 10px;">2025年1月1日15点20分</p>
            <div class="results" id="resultsContent">
                <div class="result-item">
                    <span>总人数:</span>
                    <span class="result-value" id="resultTotal">0</span>
                </div>
                <div class="result-item">
                    <span>已到人数:</span>
                    <span class="result-value" id="resultPresent">0</span>
                </div>
                <div class="result-item">
                    <span>未到人数:</span>
                    <span class="result-value" id="resultAbsent">0</span>
                </div>
                <div class="result-item">
                    <span>出勤率:</span>
                    <span class="result-value" id="resultRate">0%</span>
                </div>
                <div style="margin-top: 15px;">未到名单:</div>
                <div class="absent-list" id="absentList"></div>
            </div>
            <button class="export-btn" id="exportBtn">导出数据为图片</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 获取DOM元素
            const fileInput = document.getElementById('fileInput');
            const fileName = document.getElementById('fileName');
            const errorMessage = document.getElementById('errorMessage');
            const totalCount = document.getElementById('totalCount');
            const currentCount = document.getElementById('currentCount');
            const progressBar = document.getElementById('progressBar');
            const nameDisplay = document.getElementById('nameDisplay');
            const presentBtn = document.getElementById('presentBtn');
            const absentBtn = document.getElementById('absentBtn');
            const exportBtn = document.getElementById('exportBtn');

            const uploadStage = document.getElementById('uploadStage');
            const rollcallStage = document.getElementById('rollcallStage');
            const resultsStage = document.getElementById('resultsStage');

            const time_new = document.getElementById('time_new');


            const resultTotal = document.getElementById('resultTotal');
            const resultPresent = document.getElementById('resultPresent');
            const resultAbsent = document.getElementById('resultAbsent');
            const resultRate = document.getElementById('resultRate');
            const absentList = document.getElementById('absentList');
            const resultsContent = document.getElementById('resultsContent');

            // 存储数据
            let allNames = [];
            let currentIndex = 0;
            let presentNames = [];
            let absentNames = [];

            // 文件上传处理
            fileInput.addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    fileName.textContent = `已选择: ${file.name}`;
                    errorMessage.textContent = ''; // 清除之前的错误信息

                    const reader = new FileReader();

                    reader.onload = function (e) {
                        try {
                            // 使用TextDecoder处理UTF-8编码
                            const content = e.target.result;

                            // 处理不同操作系统的换行符
                            const namesArray = content.split(/\r\n|\n|\r/);

                            // 过滤空行和只包含空格的行
                            allNames = namesArray
                                .map(name => name.trim())
                                .filter(name => name.length > 0);

                            if (allNames.length > 0) {
                                // 检查是否包含中文字符
                                const hasChinese = allNames.some(name => {
                                    return /[\u4e00-\u9fa5]/.test(name);
                                });

                                if (!hasChinese) {
                                    console.warn('文件中未检测到中文字符，但将继续处理');
                                    console.warn('GB18030');
                                }

                                // 切换到点名阶段
                                switchStage(rollcallStage);
                                startRollCall();
                            } else {
                                errorMessage.textContent = '文件没有包含有效的名字！';
                            }
                        } catch (err) {
                            errorMessage.textContent = '处理文件时发生错误: ' + err.message;
                            console.error('File processing error:', err);
                        }
                    };

                    reader.onerror = function () {
                        errorMessage.textContent = '读取文件时发生错误，请确保文件是UTF-8编码的文本文件。';
                    };

                    // 使用readAsText并明确指定编码
                    reader.readAsText(file, 'GB18030');
                }
            });

            // 开始点名
            function startRollCall() {
                totalCount.textContent = `总人数: ${allNames.length}`;
                updateProgress();
                showCurrentName();
            }

            // 显示当前名字
            function showCurrentName() {
                if (currentIndex < allNames.length) {
                    nameDisplay.textContent = allNames[currentIndex];
                    currentCount.textContent = `当前: ${currentIndex + 1}/${allNames.length}`;
                } else {
                    finishRollCall();
                }
            }

            // 更新进度条
            function updateProgress() {
                const progress = (currentIndex / allNames.length) * 100;
                progressBar.style.width = `${progress}%`;
            }

            // 标记为已到
            presentBtn.addEventListener('click', function () {
                if (currentIndex < allNames.length) {
                    presentNames.push(allNames[currentIndex]);
                    currentIndex++;
                    updateProgress();
                    showCurrentName();
                }
            });

            // 标记为未到
            absentBtn.addEventListener('click', function () {
                if (currentIndex < allNames.length) {
                    absentNames.push(allNames[currentIndex]);
                    currentIndex++;
                    updateProgress();
                    showCurrentName();
                }
            });

            // 完成点名
            function finishRollCall() {
                // 更新结果页面
                time_new.textContent = new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString();


                resultTotal.textContent = allNames.length;
                resultPresent.textContent = presentNames.length;
                resultAbsent.textContent = absentNames.length;

                const attendanceRate = (presentNames.length / allNames.length * 100).toFixed(1);
                resultRate.textContent = `${attendanceRate}%`;

                absentList.innerHTML = '';
                if (absentNames.length > 0) {
                    absentNames.forEach(name => {
                        const div = document.createElement('div');
                        div.className = 'absent-name';
                        div.textContent = name;
                        absentList.appendChild(div);
                    });
                } else {
                    absentList.textContent = '无';
                }

                // 切换到结果页面
                switchStage(resultsStage);
            }

            // 导出数据为图片
            exportBtn.addEventListener('click', function () {
                // 显示导出提示
                const originalText = exportBtn.textContent;
                exportBtn.textContent = '正在生成图片...';
                exportBtn.disabled = true;

                html2canvas(resultsContent, {
                    scale: 2, // 提高导出图片清晰度
                    backgroundColor: '#f8f9fa',
                    logging: false // 关闭日志输出
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `点名结果_${new Date().toLocaleDateString() + "_" + new Date().toLocaleTimeString()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    // 恢复按钮状态
                    exportBtn.textContent = originalText;
                    exportBtn.disabled = false;
                }).catch(err => {
                    alert('导出图片时发生错误: ' + err.message);
                    exportBtn.textContent = originalText;
                    exportBtn.disabled = false;
                });
            });

            // 切换阶段
            function switchStage(stageToShow) {
                [uploadStage, rollcallStage, resultsStage].forEach(stage => {
                    stage.classList.remove('active');
                });
                stageToShow.classList.add('active');
            }
        });
    </script>
</body>

</html>
